# Scheduled triage of Beacon reports.
#
# Copy this into the APP's repository, not Beacon's. It runs the
# beacon-triage skill on a schedule, so reports get worked whether or not
# anybody's Mac is switched on.
#
# Until it is set up, every scheduled run stops at the first job and says
# so. It never fails, because a workflow that fails every morning trains
# everyone to ignore the one failure that matters.
#
# Before it will do anything you need, once:
#   1. The Claude GitHub App installed on the repository.
#   2. Either CLAUDE_CODE_OAUTH_TOKEN (a Claude subscription token, from
#      `claude setup-token`) or ANTHROPIC_API_KEY in repository secrets.
#      The subscription token bills against the subscription rather than
#      per-token API usage.
#   3. Triage/TRIAGE.md and .claude/skills/beacon-triage/ copied in from
#      Beacon.
#   4. ./Scripts/beacon-labels.sh <owner/repo> run once.
#
# This job runs on Linux and does everything up to the point where a fix
# has to be proven by running the app. That step needs macOS, and nothing
# here starts it: beacon-reproduce.yml is workflow_dispatch only, so a
# person runs it from the Actions tab.

name: Beacon triage

on:
  schedule:
    # 08:00 UTC on weekdays. Reports filed overnight are triaged before
    # anyone starts, and nothing runs at the weekend unasked.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      issue:
        description: "One issue number to triage, instead of the whole queue"
        required: false

concurrency:
  # Two triage runs on one queue would both claim the same issue.
  group: beacon-triage
  cancel-in-progress: false

jobs:
  # Is triage set up on this repository at all? A secret cannot be read in
  # a job's `if:` (GitHub's contexts table allows github, needs, vars and
  # inputs there and not secrets), so one job reads it and the rest depend
  # on the answer.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - id: credentials
        env:
          SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$SUBSCRIPTION_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Beacon triage is not set up yet::Reports are still \
            being filed and are waiting in the issue queue. Nothing triages them until \
            this repository has the Claude GitHub App installed and either \
            CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in its secrets. See \
            docs/setup-github.md, step 3. This run did nothing and did not fail."
          fi

  triage:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Triage needs history: it checks out the commit a report came
          # from to reproduce against the build the reporter was running.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Either one. The action takes whichever is set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            /beacon-triage
            ${{ github.event.inputs.issue && format('Triage only issue #{0}.', github.event.inputs.issue) || 'Triage the whole open queue.' }}
            The repository is ${{ github.repository }}.
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Grep,Glob,Edit,Write,WebFetch"
